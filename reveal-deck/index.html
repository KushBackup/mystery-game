<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenr: Last Seating - How It Happened</title>
<style>
:root{--ink:#0c0d0f;--paper:#ede7da;--red:#e03127;--dim:#b8b1a3;--line:#3b3d40}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--paper);font-family:Georgia,serif}.slide{display:none;min-height:100vh;padding:7vh 10vw 10vh;background:radial-gradient(circle at top left,#24262a 0,var(--ink) 48%)}.slide.active{display:block}.meta{font:12px ui-monospace,monospace;letter-spacing:.2em;color:var(--red);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:22px}.count{float:right;color:var(--dim)}h1{font:700 clamp(48px,8vw,120px)/.9 Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase;margin:12vh 0 34px;max-width:1100px}h1 em{color:var(--red);font-style:normal}.body{font-size:clamp(21px,2.1vw,34px);line-height:1.42;max-width:1050px}.body p{margin:0 0 24px}.rule{margin-top:54px;padding-top:20px;border-top:1px solid var(--line);font:14px ui-monospace,monospace;letter-spacing:.08em;color:var(--dim)}button{position:fixed;bottom:28px;border:1px solid var(--line);background:var(--ink);color:var(--paper);font:20px ui-monospace,monospace;width:54px;height:48px;cursor:pointer}#prev{left:28px}#next{right:28px}button:hover{border-color:var(--red);color:var(--red)}@media print{button{display:none}.slide{display:block!important;min-height:1080px;break-after:page;padding:100px 160px}h1{font-size:110px}.body{font-size:32px}}</style>
</head>
<body>
<main id="deck"></main><button id="prev" aria-label="Previous slide">←</button><button id="next" aria-label="Next slide">→</button>
<script>
const slides=[
['Case closed','How It <em>Happened</em>','Rehan Vora was killed at a sunset signing dinner with twenty-six guests still inside Greenr. Here is exactly how.'],
['Finding of fact','The Short <em>Answer</em>','Jack planned it. Arun created the blind spot. Manasi painted poison inside Rehan’s own black bottle. A staged AV crash, a service stair and a forged paper trail let them hide in a crowded room.'],
['The victim','Rehan <em>Vora</em>','He was the diligence partner who could still pause the signing. He carried a black steel bottle, refilled it himself and asked questions nobody wanted asked aloud.'],
['Public record','What The Room <em>Saw</em>','5:47: the bottle is left empty. 5:58: live feeds, Wi-Fi and card reader fail together. 6:08: Rehan refills his bottle. 6:18: Nathan finds him and Sharon reaches him seconds later.'],
['Part one','The <em>Plan</em>','Three criminal lanes were about to be read into one room: legal paper, ghost production work and beverage skims. The killers needed the signing to die before the truth went public.'],
['Motive','The Corrected <em>Packet</em>','Jack’s hidden carry and retainers. Arun’s recycled deliverables. Manasi’s duplicate invoices and buyback credits. Seven other people had ugly problems; only these three had criminal exposure.'],
['Recruitment','The Packet Was The <em>Recruiter</em>','On 18 September, Jack saw the first close-review queries and formed the three-person contingency. Rehan’s 12:14 warning the next day confirmed that they had to use it that night.'],
['Method','Poison In The <em>Bottle</em>','Manasi reduced yellow oleander from Greenr’s parking hedge into a brown bitters dropper. The tonic remained clean. The bottle did not.'],
['The team','Three People, Three <em>Jobs</em>','Jack: plan, frame, founder panic. Arun: scheduled sync, looped reel, deleted buffer. Manasi: dropper, service stair, dose.'],
['Part two','The <em>Day</em>','Night before: frame and poison prepared. 4:46: Arun schedules the sync. 5:47: the bottle is empty. 5:58: the crash begins.'],
['Before sunset','Prepared Before The <em>Crash</em>','Pujah fills the upstairs self-serve tonic decanter at 5:50. It is clean, communal and already upstairs before the crash. No server later carries Rehan a private drink.'],
['The blind spot','Twelve Clean <em>Minutes</em>','At 5:58 the AV sync blanks the live feeds and pulls down the guest network. Local corridor capture continues buffering, but nobody in the room can see it.'],
['The route','The Pantry Service <em>Stair</em>','Manasi uses the service-stair key during the confusion. Saanvi sees her near the stair with the brown dropper. Anjul later finds the returned key wet beside the pantry sink.'],
['The deletion','Blind Is Not <em>Gone</em>','At 6:09 Arun deletes the one buffered corridor clip. The live blackout hid the movement; the deletion removed the record that could have shown it.'],
['The witnesses','The Room Wasn’t <em>Blind</em>','Shivali saw the bottle clean and empty. Kiandra drew its original position. Nathan saw Arun with the admin tablet. Elton heard the reel loop. Anshu photographed the folder before Jack changed it.'],
['The murder','The Refill <em>Kills</em> Him','At 6:08 Rehan fills the prepared bottle from the clean self-serve decanter, takes his closing file into the library and drinks. The concentrated exposure supports collapse within minutes.'],
['The discovery','Ten Minutes <em>Later</em>','Nathan finds him at 6:18; Sharon reaches him seconds later. The shared drink is cleared. The room initially solves the crash and Nilisha’s apparent scandal instead of the murder.'],
['Part three','Why It <em>Held</em>','The room contained real fear: founder panic, soft metrics, waiver problems and system shortcuts. The killers did not invent every false lead; they arranged the order in which the room saw them.'],
['The frame','Nilisha Was <em>Framed</em>','Nilisha really inflated metrics. Jack’s sponsor packet was still fake: a night-before base file refreshed at 5:22, a wrong historical footer, synthetic mail headers, stolen welcome-board copy and late folder pages.'],
['The tech','Saima Was <em>Misread</em>','The guest stack visibly suffered, but the initiating reboot began on the AV subnet. Saima and Umair were responding to fallout, not causing it.'],
['Proof','What Proved <em>It</em>','Bottle residue, clean tonic, dropper residue, the service key, the hedge, the AV audit, the edited folder, Rehan’s memo, the group chat and the beneficiary map converge without requiring any one clue to stand alone.'],
['Verdict','Three People. Three Lanes. One <em>Bottle</em>.','Jack led Arun and Manasi in killing Rehan Vora. Jack built the frame, Arun built the blind spot, and Manasi used the service stair to dose the bottle Rehan refilled himself. Case 2609-G is closed.']
];
let index=0;const deck=document.querySelector('#deck');function render(){deck.innerHTML=slides.map(([meta,title,body],i)=>`<section class="slide ${i===index?'active':''}"><div class="meta">Greenr · Case 2609-G <span class="count">${String(i+1).padStart(2,'0')} / ${slides.length}</span></div><h1>${title}</h1><div class="body"><p>${body}</p></div><div class="rule">Greenr, Assagao, Goa · 19 September 2026</div></section>`).join('')}function move(n){index=(index+n+slides.length)%slides.length;render()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))move(1);if(['ArrowLeft','PageUp'].includes(e.key))move(-1)});render();
</script>
</body></html>
