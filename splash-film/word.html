<!doctype html>
<meta charset="utf-8">
<title>Word · the tutorial clips</title>
<style>body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain}</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="studio.js"></script>
<script src="cels.js"></script>
<script src="word-font.js"></script>
<script src="board-kit.js"></script>
<script>
'use strict';
/* ------------------------------------------------------------------------
Film brief
  Subject: the in-app tutorial for WORD, the first morning game. Six short
    clips, cut apart and shown one at a time beside the rules, each ending
    on a held, fully composed frame that also serves as its still poster.
  The game: most guests get a secret word (here POPCORN); the Killers get
    only its hint ("A snack") and must fake it. Everyone posts ONE word that
    fits, never the word itself (that scores 0). Clues land on one wall in
    the order they arrive, numbered; a faker tends to wait and read first,
    so a late, vague clue stands out. Everyone picks the 3 clues that fit
    best (gold stars). 100 for a fair clue + 50 a pick. Lowest score dies;
    skipping scores 0.
  The example, everywhere: POPCORN / "A snack". Wall: 1 Cinema, 2 Butter,
    3 Microwave, 4 Kernel, 5 Crunchy (the faker's, late).
    Never make POPCORN / A snack a live pair in src/data/packs/*.js.
  Tone: playful, never graphic. LOWEST is a rubber stamp, nothing more.
  Format: 4:3 (1440 x 1080 units), 640 px wide, 24 fps, no sound. Shown
    290-360 CSS px wide with object-fit: cover, so everything that matters
    sits in the middle 92% (x 58..1382, y 43..1037) and words are big.
  Look: the app's Help notebook. Cream paper #fbf8f0 with a blue dot grid
    that belongs to the page (cached, never moves). Navy ballpoint #24324f,
    pressure-tapered; watercolour washes a hair off the line. Sticky notes
    in the app's four shades. Gold only for stars and points, red only for
    the X and LOWEST, green only for the tick. Lettering: Patrick Hand
    (embedded by word-font.js); LOWEST in a heavy stamp face.
  Cast: four doodle guests, the creator's way (paper skin, pencil-grey hair,
    the creator's tops), the same four in every clip: Ada (bob, glasses,
    yellow), Ben (tufts, denim), Cleo (curls, sea blue), Dev (bun, pink).
    Dev is the faker in this example, marked only by acting (sweat, darting
    eyes), never by colour. Plus Zed, asleep, who only appears on the board.
  Exposure: characters on twos with light boil (a new stroke seed at 12 Hz)
    on their contours, the ring marks and the z's; slaps, flips, stamps and
    taps on ones. Paper, notes, cards and lettering never boil.
  Beat sheet (each clip: action, then a ~1.2 s hold that reads on its own)
    0.00  wake   5.50  four guests asleep at a cafe table, z z; phones buzz
                       and hop (1.0); they jolt awake (1.5), grab the phones,
                       look; WORD writes itself on (2.55) and is underlined
    5.50  cards  5.00  four tent cards, face down; they spin over one by one
                       (0.75, +0.5 each): POPCORN x3, then "A snack ?";
                       Dev above card 4 sweats, eyes dart
   10.50  write  4.75  a pencil writes "Butter" on a big note, a green tick,
                       a 100 tag; a small "Popcorn" note slides in, a red X
                       is scribbled over it, it droops, 0
   15.25  wall   5.50  notes slap onto the wall, numbered 1-4 (0.35 .. 1.55);
                       Dev peeks round the edge, reading, sweating; at 3.3
                       note 5 "Crunchy" drifts in, late and slow
   20.75  pick   5.25  closer on the wall; a fingertip taps Cinema, Butter,
                       Kernel and a gold star stamps on each; a second hand
                       taps Butter; its tag ticks 100 > 150 > 200
   26.00  board  4.75  THE BOARD: 300, 250, 200, 150 and Zed asleep on 0,
                       phone face-down; LOWEST thumps onto Zed's row
  Total 30.75 s. Ship: six clips cut at those boundaries (public/tutorial).
  Sources: none; everything is drawn here. Patrick Hand: SIL OFL.
------------------------------------------------------------------------- */

// ---------------------------------------------------------------- the wall (clips 4 and 5)
const WALL = { x0: 70, y0: 62, x1: 1176, y1: 1018 };
const CLUES = [
  { word: 'Cinema', col: NOTE.sky, x: 272, y: 312, r: -.04 },
  { word: 'Butter', col: NOTE.butter, x: 632, y: 300, r: .03 },
  { word: 'Microwave', col: NOTE.mint, x: 986, y: 318, r: -.02 },
  { word: 'Kernel', col: NOTE.lilac, x: 300, y: 736, r: .035 },
  { word: 'Crunchy', col: NOTE.butter, x: 712, y: 766, r: -.07 },
];
const NW = 330, NH = 286;
function wallSheet(c) {
  const pts = warp(rectPts(WALL.x0, WALL.y0, WALL.x1 - WALL.x0, WALL.y1 - WALL.y0), 81, 3, true, 40), path = curvePath(pts, true, .5);
  c.save(); c.shadowColor = 'rgba(36,50,79,.20)'; c.shadowBlur = 16 * S; c.shadowOffsetX = 6 * S; c.shadowOffsetY = 8 * S; c.fillStyle = PAPER; c.fill(path); c.restore();
  c.save(); c.clip(path); blit(c, PAGE); c.restore();
  ln(c, pts, 4, 82, true, INK, { amp: 1, corner: .5, p: .4 });
  // two pins at the top
  for (const [x, s] of [[WALL.x0 + 60, 1], [WALL.x1 - 60, 2]]) { dot(c, x + 3, WALL.y0 + 34, 13, 13, 'rgba(36,50,79,.18)'); dot(c, x, WALL.y0 + 30, 13, 13, SEA); ln(c, ellPts(x, WALL.y0 + 30, 13, 13, 0, 20), 3, 83 + s, true, INK, { amp: .3 }); dot(c, x - 4, WALL.y0 + 25, 4, 4, '#ffffff'); }
}
// One clue note on the wall, with its slap: k = time since it landed (negative = in flight).
function clueNote(c, q, k, o = {}) {
  const C = CLUES[q], { slow = false, stars = 0, tagged = null, closer = 0 } = o;
  const inT = slow ? .62 : .17;
  if (k < -inT) return;
  let x = C.x, y = C.y, r = C.r, sc = 1, sx = 1, sy = 1, lift = 0, al = 1;
  if (k < 0) {
    const u = 1 + k / inT;               // 0..1 in flight
    if (slow) { const e = easeOutQuint(u); x = lerp(C.x + 300, C.x, e); y = lerp(C.y + 260, C.y, e) - Math.sin(u * Math.PI) * 40; r = C.r + (1 - e) * .5 + Math.sin(u * 7) * .05 * (1 - u); sc = lerp(1.12, 1, e); lift = 1 - e; al = clamp(u * 3, 0, 1); }
    else { const e = easeIn(u); x = lerp(C.x - 60, C.x, e); y = lerp(C.y - 110, C.y, e); sc = lerp(1.6, 1, e); lift = 1 - e; r = C.r - (1 - e) * .14; }
  } else if (!slow) {
    // impact: a squash on the contact frames, an overshoot, then still
    const f = Math.floor(k * 24);
    [sx, sy] = f === 0 ? [1.08, .9] : f === 1 ? [1.04, .95] : f === 2 ? [.98, 1.02] : [1, 1];
  } else { const f = Math.floor(k * 24); [sx, sy] = f === 0 ? [1.03, .97] : [1, 1]; }
  c.save(); c.globalAlpha *= al; c.translate(x, y); c.rotate(r); c.scale(sc * sx, sc * sy);
  sticky(c, NW, NH, C.col, 300 + q * 13, { lift });
  txt(c, C.word, 0, 20, 96, { fit: NW - 50 });
  // little impact ticks at the corners
  if (!slow && k >= 0 && k < .13) { const a = 1 - k / .13; c.save(); c.globalAlpha *= a; for (const [px, py, dx, dy] of [[-NW / 2 - 14, -NH / 2 - 8, -1, -1], [NW / 2 + 14, -NH / 2 - 8, 1, -1], [-NW / 2 - 14, NH / 2 + 8, -1, 1], [NW / 2 + 14, NH / 2 + 8, 1, 1]]) ln(c, [[px, py], [px + dx * 26, py + dy * 18]], 5, 310 + q, false, INK, { amp: .3 }); c.restore(); }
  c.restore();
  // the badge pops two frames after the slap
  const bk = k < .06 ? 0 : easeOutBack(clamp((k - .06) / .16, 0, 1));
  const bp = add([x, y], rot2([-NW / 2 + 18, -NH / 2 + 14], r));
  badge(c, q + 1, bp[0], bp[1], 42, bk);
}

// ---------------------------------------------------------------- clip 4: the wall
function devPeek(c, tau, i) {
  // Dev leans in from behind the wall's right edge, reads, sweats.
  const t = twos(tau);
  const inK = easeOutQuint(win(t, 1.6, 2.05)), back = easeInOutSine(win(t, 3.2, 3.6)) * (1 - easeInOutSine(win(t, 3.95, 4.3)));
  if (inK <= 0) return;
  const ex = WALL.x1, hx = lerp(1540, ex + 66, inK) + back * 30, hy = 520 + back * 6;
  // where the eyes are reading: each note in order, darting on twos
  const reads = [[1.95, [-1, -.9]], [2.2, [-1, -.7]], [2.42, [-.7, -.6]], [2.62, [-1, .3]], [2.86, [-.6, .2]], [3.06, [-1, .5]], [3.3, [-.7, .9]], [3.7, [-.9, .7]], [4.3, [-1, .1]]];
  let gaze = [-1, -.6]; for (const [at, gz] of reads) if (t >= at) gaze = gz;
  const sweat = t > 2.5 ? ((t - 2.5) * .55) % 1 : 0;
  const f = { eyes: 'look', brows: 'worry', mouth: t > 3.6 ? 'tight' : 'wobble', gaze, turn: -.8, sweat: t > 2.5 ? sweat : 0 };
  const sc = 1.45, seed = 4000 + bz(i);
  // the body, behind the wall: neck and a shoulder going out of frame (the near hand grips the edge: devFingers)
  const g = CAST.dev;
  neck(c, [hx + 4, hy + 60], [hx + 16, hy + 104], seed + 880);
  shape(c, [[hx - 34, hy + 104], [hx + 30, hy + 92], [hx + 118, hy + 118], [hx + 172, hy + 210], [hx + 196, H + 40], [hx - 40, H + 40], [hx - 54, hy + 180]], g.top, seed + 900, { w: 6.5, corner: 1.2 });
  ln(c, [[hx - 10, hy + 98], [hx + 14, hy + 118], [hx + 40, hy + 96]], 4, seed + 905, false, INK, { amp: .5 });
  head(c, g, hx, hy, sc, f, seed, { tilt: -.2 });
}
const devHand = t => { const k = easeOutQuint(win(t, 1.7, 2.1)), back = easeInOutSine(win(t, 3.2, 3.6)) * (1 - easeInOutSine(win(t, 3.95, 4.3))); return [lerp(WALL.x1 + 120, WALL.x1 + 26, k) + back * 10, 690]; };
// Four fingertips curled round the front of the wall's edge (the palm stays behind it).
function devFingers(c, tau, i) {
  const t = twos(tau); if (t < 1.7) return;
  const k = easeOutQuint(win(t, 1.7, 2.1)), [hx, y] = devHand(t), seed = 4100 + bz(i);
  for (let q = 0; q < 4; q++) {
    const fy = y - 44 + q * 27, fx = hx - lerp(10, 44, k) + (q === 0 || q === 3 ? 6 : 0);
    if (fx > WALL.x1 + 30) continue;
    shape(c, put(blob(0, 0, 24, 12.5, seed + q, { amp: .05 }), fx, fy, .04 * (q - 1.5)), null, seed + 10 + q, { w: 4.5 });
  }
}
function wallClip(c, tau, i) {
  page(c); wallSheet(c);
  for (let q = 0; q < 4; q++) clueNote(c, q, tau - (.35 + q * .4));
  clueNote(c, 4, tau - 3.92, { slow: true });
  // Dev is behind the wall: draw the sheet edge over the head again
  c.save();
  const edge = new Path2D(); edge.rect(WALL.x1 + 2, 0, W, H);
  c.clip(edge); devPeek(c, tau, i); c.restore();
  devFingers(c, tau, i);
}

</script>
<script src="word-clips.js"></script>
<script>
'use strict';
FONT_READY.then(() => { defineFilm({
  palette: makePalette({ paper: PAPER, ink: INK, finish: 'flat', washBlend: 'multiply' }, 'doodlePastel'),
  format: { ar: '4:3', width: 640 },
  timeline: [
    { name: 'wake', dur: 5.5, fn: wakeClip },
    { name: 'cards', dur: 5.0, fn: cardsClip },
    { name: 'write', dur: 4.75, fn: writeClip },
    { name: 'wall', dur: 5.5, fn: wallClip },
    { name: 'pick', dur: 5.25, fn: pickClip },
    { name: 'board', dur: 4.75, fn: boardClip },
  ],
}); }).catch(e => { window.__error = String(e); });
</script>
