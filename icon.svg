<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle with noir theme -->
  <circle cx="256" cy="256" r="256" fill="#1c1917"/>
  
  <!-- Detective ghost mascot -->
  <g transform="translate(256, 140)">
    <!-- Ghost body -->
    <ellipse cx="0" cy="40" rx="70" ry="80" fill="#f5f5f4" opacity="0.95"/>
    <path d="M -70 80 Q -70 140 -50 150 Q -30 160 -10 150 Q 10 160 30 150 Q 50 160 70 150 Q 70 140 70 80 Z" fill="#f5f5f4" opacity="0.95"/>
    
    <!-- Eyes -->
    <circle cx="-25" cy="30" r="12" fill="#1c1917"/>
    <circle cx="25" cy="30" r="12" fill="#1c1917"/>
    <circle cx="-22" cy="27" r="4" fill="#f5f5f4"/>
    <circle cx="28" cy="27" r="4" fill="#f5f5f4"/>
    
    <!-- Mouth -->
    <path d="M -20 55 Q 0 65 20 55" stroke="#1c1917" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Detective hat -->
    <ellipse cx="0" cy="-20" rx="75" ry="15" fill="#1c1917"/>
    <rect x="-45" y="-50" width="90" height="30" fill="#1c1917" rx="5"/>
    <rect x="-35" y="-48" width="70" height="5" fill="#dc2626"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(360, 320) rotate(-30)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#dc2626" stroke-width="8"/>
    <circle cx="0" cy="0" r="30" fill="#f5f5f4" opacity="0.3"/>
    <line x1="25" y1="25" x2="50" y2="50" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- Clue cards scattered -->
  <g transform="translate(140, 340) rotate(-15)">
    <rect x="0" y="0" width="60" height="80" fill="#fef3c7" stroke="#1c1917" stroke-width="2" rx="3"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="#1c1917" stroke-width="2"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="#1c1917" stroke-width="1.5"/>
    <line x1="10" y1="32" x2="40" y2="32" stroke="#1c1917" stroke-width="1.5"/>
  </g>
  
  <!-- Title text -->
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#f5f5f4" text-anchor="middle">MYSTERY</text>
  <text x="256" y="460" font-family="system-ui, sans-serif" font-size="28" fill="#dc2626" text-anchor="middle">GAME</text>
</svg>
